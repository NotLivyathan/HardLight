# Devices which are not portable but don't link up to anything
- type: entity
  id: AtmosDeviceFanTiny
  name: tiny fan
  description: A tiny fan, releasing a thin gust of air.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/tinyfan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
  - type: Destructible # Mono - destructible tiny/directional fans
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: Anchorable # Mono
    delay: 6
  - type: Pullable # Mono
  - type: Rotatable # Mono
  # Mono
  - type: ShipRepairable
    repairTime: 5
    repairCost: 10

- type: entity # HardLight
  id: AtmosDeviceFanDirectionalAssembly
  name: directional fan assembly
  description: An unfinished directional fan assembly.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon-off
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
  - type: Construction
    graph: GasUnary
    node: directionalfanFrame
  - type: Anchorable
    delay: 6
  - type: Pullable
  - type: Rotatable

- type: entity
  id: AtmosDeviceFanDirectional
  name: directional fan
  description: A thin fan, stopping the movement of gases across it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
  # HardLight start
    layers:
    - state: icon-off
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { state: icon-on }
          False: { state: icon-off }
  # HardLight end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
      - South
    airBlocked: false # HardLight
  - type: Clickable
  - type: Tag
    tags:
      - SpreaderIgnore
  # HardLight start
  - type: PoweredDirectionalFan
  - type: Battery
    maxCharge: 360
    startingCharge: 360
  - type: ExaminableBattery
  - type: ApcPowerReceiverBattery
    idleLoad: 6
    batteryRechargeRate: 6
    batteryRechargeEfficiency: 1
  - type: ApcPowerReceiver
    powerLoad: 6
  - type: ExtensionCableReceiver
  - type: Construction
    graph: GasUnary
    node: directionalfan
  - type: RCDDeconstructable
    cost: 10
    delay: 10
  # HardLight end
  - type: Destructible # Mono: Destructible tiny/directional fans
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: Anchorable # Mono
    delay: 6
  - type: Pullable # Mono
  - type: Rotatable # Mono
  # Mono
  - type: ShipRepairable
    repairTime: 4
    repairCost: 8
