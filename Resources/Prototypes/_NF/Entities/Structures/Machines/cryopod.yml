- type: entity
  id: MachineCryoSleepPod
# HardLight: We don't really use these the way Frontier does, so I'm commenting everything out and parenting it to the normal cryosleep pod.
#  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseMachine]
  parent: BaseStructure # HardLight
  name: cryo sleep chamber
  description: Cold pillow, guaranteed.
  components:
# HardLight: We don't really use these the way Frontier does, so I'm commenting everything out and parenting it to the normal cryosleep pod.
#  - type: Sprite
#    sprite: _NF/Structures/Machines/cryopod.rsi
#    snapCardinals: true # Frontier
#    layers:
#    - state: closed
#  - type: Physics
#    bodyType: Static
#  - type: Fixtures
#    fixtures:
#      fix1:
#        shape:
#          !type:PhysShapeAabb
#          bounds: "-0.45,-0.45,0.45,0.45"
#        density: 190
#        mask:
#        - MachineMask
#        layer:
#        - MobLayer # To allow people to pass through
#  - type: MaterialStorage
#  - type: Appearance
#  - type: Climbable
#  - type: CryoSleep
#  - type: ContainerContainer
#    containers:
#      body_container: !type:ContainerSlot
  # HardLight start
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    noRot: true
    sprite: _NF/Structures/Machines/cryopod.rsi
    layers:
    - state: closed
      map: ["base"]
  - type: UserInterface
    interfaces:
      enum.CryostorageUIKey.Key:
        type: CryostorageBoundUserInterface
  - type: ActivatableUI
    key: enum.CryostorageUIKey.Key
  - type: AccessReader
    breakOnAccessBreaker: false
    access: [["Cryogenics"]]
  - type: InteractionOutline
  - type: Cryostorage
  - type: Physics
    canCollide: false
  - type: DragInsertContainer
    containerId: storage
    entryDelay: 2
  - type: ExitContainerOnMove
    containerId: storage
  - type: ContainerContainer
    containers:
      storage: !type:ContainerSlot
  - type: Appearance
  # HardLight end

# If cryopods get deleted, this one is considered as a safe fallback.
- type: entity
  id: MachineCryoSleepPodFallback
  parent: MachineCryoSleepPod
  suffix: Fallback
  components:
  - type: CryoSleepFallback

- type: entity
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, BaseMachinePowered]
  id: MachineMedicalBountyRedemption
  name: body retrieval unit
  description: A teleporter to return lost bodies with bounties on them. Dispenses cash on teleport.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/body_retrieval_unit.rsi
    snapCardinals: true # Frontier
    layers:
    - state: closed
      map: ["base"]
    - state: left_on_unlit
      shader: unshaded
      map: ["lights"]
      visible: false
  - type: UserInterface
    interfaces:
      enum.MedicalBountyRedemptionUiKey.Key:
        type: MedicalBountyRedemptionBoundUserInterface
  - type: ActivatableUI
    key: enum.MedicalBountyRedemptionUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: DragInsertContainer
    containerId: body_container
  - type: ExitContainerOnMove
    containerId: body_container
  - type: ContainerContainer
    containers:
      body_container: !type:ContainerSlot
  - type: MedicalBountyRedemption
    bodyContainer: body_container
    taxAccounts:
      Medical: 0.75 # 75%
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedicalBountyRedemptionVisuals.Full:
        base:
          True: { state: closed_full }
          False: { state: closed }
        lights:
          True: { state: both_on_unlit }
          False: { state: left_on_unlit }
      enum.PowerDeviceVisuals.Powered:
        lights:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 1000 # Keeping this explicit
  - type: Climbable
